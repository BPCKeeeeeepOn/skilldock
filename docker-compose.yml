services:
  skilldock:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: skilldock
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: production
      PORT: "3010"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3010/api/skills"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
